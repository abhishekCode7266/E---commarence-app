name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter environment
        run: flutter --version

      - name: Ensure Web Support
        run: |
          cp web/index.html web/index.html.bak 2>/dev/null || true
          flutter create . --platforms web --project-name flutter_todo_capstone
          if [ -f web/index.html.bak ]; then
            mv web/index.html.bak web/index.html
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          set -eo pipefail
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Verify Web Build Artifacts
        run: |
          echo "=== Web Build Contents ==="
          ls -la build/web
          if [ ! -f build/web/index.html ]; then
            echo "::error::index.html is missing from build/web!"
            exit 1
          fi
          if [ ! -f build/web/main.dart.js ] && [ ! -f build/web/main.dart.wasm ]; then
            echo "::error::main.dart.js is missing from build/web!"
            exit 1
          fi
          echo "Web build successfully verified!"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          cname: ''

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
