name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter environment
        run: flutter --version

      - name: Ensure Web Support
        run: flutter create . --platforms web --project-name flutter_todo_capstone

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" 2>&1 | tee build.log

      - name: Report Error Details
        if: failure()
        run: |
          echo "=== BUILD ERROR LOG ==="
          cat build.log
          ERR=$(tail -n 20 build.log | tr '\n' ' ' | tr '"' "'")
          echo "::error title=Flutter Build Error::$ERR"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          cname: ''
