name: flutter_todo_capstone
description: "A production-ready Flutter To-Do mobile application integrated with Firebase Auth, Cloud Firestore, local & push notifications, and Material 3 theming."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core and Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # State Management & Storage
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Notifications & Scheduling
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Utility & Formatting
  intl: ^0.19.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
